services:
  # ── SQL Server ────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: train-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Train2026db"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Train2026db", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    container_name: train-backend
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 1433
      DB_NAME: TrainOfTheFuture
      DB_USER: sa
      DB_PASSWORD: Train2026db
      WS_PORT: 3001
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: train-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # ── Simulator ─────────────────────────────────────────────────
  simulator:
    build: ./simulator
    container_name: train-simulator
    environment:
      API_URL: http://backend:3000/api/telemetry
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  db-data: